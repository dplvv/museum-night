<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="event-page">
    <article class="event-card" aria-labelledby="event-title">
      <h1 id="event-title">Ночь в музее</h1>
      <p id="event-date" class="event-date">15 ноября, 18:30</p>
      <p id="event-place">Музей космонавтики, проспект Мира, 111</p>
      <p id="event-description">Вечерняя программа с выставкой и экскурсиями</p>
      <button id="show-program" type="button" aria-controls="program" aria-expanded="false">Показать программу</button>
      <p id="program" class="program" hidden></p>
    </article>

    <p id="data-error" class="error" role="alert" hidden></p>

    <form id="service-form" class="service-form" hidden>
      <fieldset>
        <legend>Дополнительные услуги</legend>
        <label class="service-option">
          <input id="guide" type="checkbox">
          Экскурсия с гидом <span class="price">500 руб.</span>
        </label>
        <label class="service-option">
          <input id="audio" type="checkbox">
          Аудиогид <span class="price">350 руб.</span>
        </label>
        <label class="service-option">
          <input id="catalog" type="checkbox">
          Каталог выставки <span class="price">250 руб.</span>
        </label>
      </fieldset>

      <button type="submit">Рассчитать</button>
      <p id="choice-error" class="error" role="alert" hidden></p>
      <div id="result" class="result" role="status" hidden></div>
      <pre id="report-json" class="report-json" aria-label="Отчёт в формате JSON" hidden></pre>
    </form>
  </main>
  <script src="./app.js"></script>
</body>
</html>
